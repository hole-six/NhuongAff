<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunnyHoanTien - Thông Báo</title>
</head>
<body style="margin: 0; padding: 20px; background: #FFF0F4; font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 560px; margin: 0 auto; background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(209, 58, 107, 0.12);">
        
        <!-- Mini Header -->
        <tr>
            <td style="background: linear-gradient(135deg, #FFF0F4, #FFDFE8); padding: 24px; text-align: center;">
                <img src="https://hoahuongaff.click/mascots/icons/bunny-wink.webp" alt="Bunny" width="64" height="64" style="border-radius: 50%; background: white; padding: 8px; box-shadow: 0 4px 12px rgba(209, 58, 107, 0.15);">
                <h1 style="margin: 12px 0 0; font-family: 'Lexend', sans-serif; font-size: 24px; font-weight: 900; color: #D13A6B;">BunnyHoanTien</h1>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding: 32px 24px;">
                
                <!-- Title -->
                <h2 style="margin: 0 0 16px; font-family: 'Lexend', sans-serif; font-size: 20px; font-weight: 800; color: #2E1F26;">
                    {{TITLE}}
                </h2>

                <!-- Message -->
                <p style="margin: 0 0 24px; font-family: 'Lexend', sans-serif; font-size: 15px; font-weight: 400; color: #5C4652; line-height: 1.7;">
                    {{MESSAGE}}
                </p>

                <!-- Button (Optional) -->
                <div style="text-align: center; margin-top: 24px;">
                    <a href="{{BUTTON_URL}}" style="display: inline-block; background: linear-gradient(135deg, #D13A6B, #E8558A); color: white; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-family: 'Lexend', sans-serif; font-size: 15px; font-weight: 700; box-shadow: 0 4px 16px rgba(209, 58, 107, 0.25);">
                        {{BUTTON_TEXT}}
                    </a>
                </div>

            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="background: #FFF0F4; padding: 24px; text-align: center; border-top: 2px solid #FFDFE8;">
                <p style="margin: 0 0 8px; font-family: 'Lexend', sans-serif; font-size: 13px; font-weight: 600; color: #5C4652;">
                    📞 <a href="tel:0336487534" style="color: #D13A6B; text-decoration: none;">033.648.7534</a> | 
                    🌐 <a href="https://hoahuongaff.click" style="color: #D13A6B; text-decoration: none;">hoahuongaff.click</a>
                </p>
                <p style="margin: 0; font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 500; color: #9A8490;">
                    © 2024 BunnyHoanTien. Hệ thống hoàn tiền thông minh.
                </p>
            </td>
        </tr>

    </table>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</body>
</html>
